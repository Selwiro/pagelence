org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# 受限环境里 ~/Library/Application Support/kotlin/daemon 不可写，编译走进程内策略。
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

# 完整词表已托管在 GitHub Releases（tag dict-39cfb96）。临时关闭下载入口：
#   ./gradlew :app-phone:assembleDebug -Ppagelence.fullDictEnabled=false
pagelence.fullDictEnabled=true
