name: ci

# 最小门禁：内容产物校验、单测（core/data/sync/presentation）、两个 App 编译与 lint。
# 外部数据（wordfreq、ECDICT CSV、词级来源）不在仓库里，CI 用
# PAGELENCE_ALLOW_MISSING=1 跳过并打印跳过项；发版前在本机跑严格模式补齐。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2026-11 起 runner 镜像新增了 Google TV / XR 等许可，setup-android 的自动
      # 接受会停在交互提示上（sdkmanager 退出 1）。先自己用 yes 接受全部许可，
      # 再让 action 跳过许可步骤。
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Content, tests, app build, lint
        run: PAGELENCE_ALLOW_MISSING=1 tools/ci_check.sh
