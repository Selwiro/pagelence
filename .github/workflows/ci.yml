name: ci

# 最小门禁：内容产物校验、单测（core/data/sync/presentation）、两个 App 编译与 lint。
# 外部数据（wordfreq、ECDICT CSV、词级来源）不在仓库里，CI 用
# PAGELENCE_ALLOW_MISSING=1 跳过并打印跳过项；发版前在本机跑严格模式补齐。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Content, tests, app build, lint
        run: PAGELENCE_ALLOW_MISSING=1 tools/ci_check.sh
