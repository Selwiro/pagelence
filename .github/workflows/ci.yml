name: ci

# 最小门禁：内容产物校验、单测（core/data/sync/presentation）、两个 App 编译与 lint。
# 外部数据（wordfreq、ECDICT CSV、词级来源）不在仓库里，CI 用
# PAGELENCE_ALLOW_MISSING=1 跳过并打印跳过项；发版前在本机跑严格模式补齐。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再用 android-actions/setup-android：2026-11 的 runner 镜像里它会把
      # cmdline-tools 判成「版本不对」，随后执行 `sdkmanager tools`，而 `tools`
      # 已从 SDK 仓库移除，直接失败。runner 自带 SDK，这里只补许可与所需组件。
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # API 37 目前只在 runner 预装镜像里（稳定频道拿不到），不强行安装；
          # build-tools 36 与 platform-tools 同理缺什么由 Gradle 报错。
          ls "$SDK_ROOT/platforms" | tail -5
          ls "$SDK_ROOT/build-tools" | tail -5

      - uses: gradle/actions/setup-gradle@v4

      - name: Content, tests, app build, lint
        run: PAGELENCE_ALLOW_MISSING=1 tools/ci_check.sh
